<!DOCTYPE html>
<html lang="esp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abel&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>DASHBOARD</title>
</head>
<body>
    <div class="dashboard">
        <header class="header">
            <div>
                <i class="fa-solid fa-bars"></i>
            </div>
    
            <nav class="user-nav">
            <span> <i class="fa-solid fa-user-tie"></i> Usuario</span>
            <span> <i class="fa-solid fa-bell"></i> Notificaciones</span>
            </nav>
        </header>
        
        <aside class="sidebar">
            <div class="sidebar-logo">
                    <img src="https://www.creativosonline.org/wp-content/uploads/2015/04/inicial.png" alt="logo-sidebar">
            </div>

            <nav>
                <ul>
                    <li class="opciones"><a href="#"> <i class="fa-solid fa-house-chimney-window"></i>HOME</a></li>
                    <li class="opciones"><a href="#"> <i class="fa-solid fa-file"></i> RESUMEN</a></li>
                    <li class="opciones"><a href="#"> <i class="fa-solid fa-list-check"></i> PROYECTOS</a></li>
                    <li class="opciones"><a href="#"> <i class="fa-solid fa-people-line"></i> EQUIPO</a></li>
              </ul>
            </nav>
        </aside>

        <main class="main-content">
            <section class="welcome-section">
                <h2>Bienvenido</h2>
                <p>Zona de informes de equipo y desarrollo</p>
            </section>

            <section class="stats-grid">
                <div class="card">
                    <h3>Progreso</h3>
                    <p class="stat-number">20</p>
                </div>

                <div class="card">
                    <h3>Finalizado</h3>
                    <p class="stat-number">33</p>
                </div>

                <div class="card">
                    <h3>Upload</h3>
                    <p class="stat-number">67</p>
                </div>

            </section>
        
            <section class="project-details card">
                <h2>Detalles del proyecto sprint 3</h2>
                <p><strong>Objetivo:</strong> Conectar mediante API el frontend y verficiar que sea un sitio responsivo</p>
                <div class="progress-bar">
                    <div class="progress" style="width: 75%;">75%</div>
                </div>
            </section>
        
        </main>
    </div>
    <script src="https://kit.fontawesome.com/151970cc4d.js" crossorigin="anonymous"></script>
</body>
</html>
